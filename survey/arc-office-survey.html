<title>ARC HK office survey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen drafting tool. Plan canvas fills the screen; a details panel sits on the right (desktop) or below (phone). */
:root{
  --paper:#f3f5f8; --sheet:#ffffff; --ink:#1f2a44; --ink-2:#56607a; --line:#d5dae4;
  --wall:#1f2a44; --glass:#5b9bd5; --window:#1f2a44;
  --room:#f2ebe0; --core:#e4e6ea; --zone:#f7f8fa; --joinery:#e8d6b5; --furn:#ffffff; --furn-line:#8d95a8;
  --accent:#c8102e; --ok:#13865a; --ok-soft:#dff2e9; --warn:#b26a00; --bad:#c62828; --bad-soft:#fde7e7;
  --sel:#c8102e; --input:#ffffff;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1420; --sheet:#151b29; --ink:#e7ebf3; --ink-2:#9aa4ba; --line:#2a3245;
  --wall:#dfe5f0; --glass:#6fb0ea; --window:#dfe5f0;
  --room:#2a2620; --core:#232834; --zone:#181e2c; --joinery:#4a3d27; --furn:#1d2433; --furn-line:#7d879c;
  --accent:#ff5a6e; --ok:#3ccf8e; --ok-soft:#173a2b; --warn:#f0a73a; --bad:#ff6b6b; --bad-soft:#3d1c1f;
  --sel:#ff5a6e; --input:#0f1420; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1420; --sheet:#151b29; --ink:#e7ebf3; --ink-2:#9aa4ba; --line:#2a3245;
  --wall:#dfe5f0; --glass:#6fb0ea; --window:#dfe5f0;
  --room:#2a2620; --core:#232834; --zone:#181e2c; --joinery:#4a3d27; --furn:#1d2433; --furn-line:#7d879c;
  --accent:#ff5a6e; --ok:#3ccf8e; --ok-soft:#173a2b; --warn:#f0a73a; --bad:#ff6b6b; --bad-soft:#3d1c1f;
  --sel:#ff5a6e; --input:#0f1420; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden;font-size:13px}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--sheet);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-weight:700;letter-spacing:.04em;font-size:14px;text-transform:uppercase}
.brand span{font-size:12px;color:var(--ink-2)}
.prog{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.bar{width:90px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:7px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.small{padding:4px 8px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:default}
.tools{display:flex;gap:6px;flex-wrap:wrap}
main{min-height:0;display:grid;grid-template-columns:1fr 370px}
.canvas{position:relative;min-width:0;min-height:0;background:var(--paper)}
svg#plan{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
svg#plan.dragging{cursor:grabbing}
.zoom{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:38px;height:38px;padding:0;font-size:18px;line-height:1}
.legend{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));bottom:10px;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--ink-2);background:color-mix(in srgb,var(--sheet) 88%,transparent);border:1px solid var(--line);border-radius:6px;padding:6px 9px;max-width:calc(100% - 80px)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:16px;height:0;border-top:3px solid}
aside{background:var(--sheet);border-left:1px solid var(--line);overflow:auto;min-height:0;padding-block:14px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h2{font-size:15px;margin:0;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.chip{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--line);color:var(--ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.head{display:flex;flex-direction:column;gap:6px}
.head .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dim{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.dim.ok{border-color:var(--ok)}
.dim.bad{border-color:var(--bad)}
.dim.active{box-shadow:0 0 0 2px var(--sel)}
.dim label{font-size:12px;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dim label small{font-weight:400;color:var(--ink-2);font-family:var(--mono);font-size:12px}
.entry{display:flex;gap:6px;align-items:center}
.entry input{flex:1;min-width:0;font-family:var(--mono);font-size:16px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--ink);font-variant-numeric:tabular-nums}
.entry .unit{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.hint{font-size:12px;color:var(--ink-2);min-height:1em}
.hint.bad{color:var(--bad)}
.hint.warn{color:var(--warn)}
.dim.pend{border-color:var(--warn)}
.item .st.warn{color:var(--warn)}
select{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--ink)}
.units{display:flex;flex-direction:column;gap:8px}
.thick{stroke:none;fill-opacity:.35}
.thick.wall,.thick.window{fill:var(--wall)}
.thick.glass{fill:var(--glass)}
.side{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:3px 8px;font-size:12px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--sheet)}
textarea{width:100%;min-height:60px;font:inherit;font-size:13px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--ink);resize:vertical}
.list{display:flex;flex-direction:column;gap:2px}
.group-t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin-top:10px;margin-bottom:2px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:12px;border:0;background:none;text-align:left;width:100%}
.item:hover{background:var(--paper)}
.item .st{font-family:var(--mono);font-size:11px;color:var(--ink-2);white-space:nowrap}
.item .st.ok{color:var(--ok)}
.item .st.bad{color:var(--bad)}
.howto{font-size:12px;line-height:1.5;color:var(--ink-2);margin:0;padding-left:18px}
.howto li{margin-bottom:4px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.note{font-size:12px;color:var(--ink-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(10,14,24,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal .box{background:var(--sheet);border-radius:10px;max-width:560px;width:100%;max-height:90%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.modal textarea{min-height:200px;font-family:var(--mono);font-size:11px}
/* SVG */
.room{stroke:var(--furn-line);stroke-width:.6;vector-effect:non-scaling-stroke}
.room.k-room{fill:var(--room)} .room.k-core{fill:var(--core)} .room.k-zone{fill:var(--zone)} .room.k-joinery{fill:var(--joinery)} .room.k-open{fill:var(--zone)}
.room.k-zone{stroke-dasharray:4 3}
.room.ok{fill:color-mix(in srgb,var(--ok) 14%,var(--zone))}
.obj{fill:var(--furn);stroke:var(--furn-line);stroke-width:1;vector-effect:non-scaling-stroke}
.obj.pillar{fill:var(--ink);stroke:none}
.obj.tv{fill:var(--ink);stroke:none}
.obj.ok{stroke:var(--ok);stroke-width:2}
.obj.pillar.ok{fill:var(--ok)}
.chair{fill:none;stroke:var(--furn-line);stroke-width:.8;vector-effect:non-scaling-stroke}
.wl{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:butt}
.wl.wall{stroke:var(--wall);stroke-width:3.5}
.wl.glass{stroke:var(--glass);stroke-width:3}
.wl.window{stroke:var(--window);stroke-width:5}
.wl.window-in{stroke:var(--sheet);stroke-width:1.6}
.wl.ok{stroke:var(--ok)}
.wl.bad{stroke:var(--bad)}
.hit{stroke:transparent;stroke-width:22;fill:none;vector-effect:non-scaling-stroke;cursor:pointer}
.door{fill:none;stroke:var(--ink-2);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:4 3}
.door.leaf{stroke-dasharray:none;stroke-width:1.6;stroke:var(--ink)}
.door.ok{stroke:var(--ok)}
.selbox{fill:none;stroke:var(--sel);stroke-width:2.5;vector-effect:non-scaling-stroke}
.selline{stroke:var(--sel);stroke-width:7;stroke-opacity:.45;vector-effect:non-scaling-stroke;fill:none}
.dl{stroke:var(--sel);stroke-width:1.2;vector-effect:non-scaling-stroke;fill:none}
.dl.ok{stroke:var(--ok)}
.dl.est{stroke:var(--ink-2)}.dl.calc{stroke-dasharray:4 3}
.dt{font-family:var(--mono);font-weight:500;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--sheet);stroke-width:4px;stroke-linejoin:round;fill:var(--sel)}
.dt.ok{fill:var(--ok)}
.dt.est{fill:var(--ink-2)}
.dt.big{stroke-width:5px;font-weight:600}
.rl{font-family:var(--sans);font-weight:600;text-anchor:middle;fill:var(--ink);pointer-events:none}
.rl2{font-family:var(--mono);text-anchor:middle;fill:var(--ink-2);pointer-events:none}
.ol{font-family:var(--sans);text-anchor:middle;dominant-baseline:central;fill:var(--ink-2);pointer-events:none}
@media (max-width: 760px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  aside{border-left:0;border-top:1px solid var(--line);max-height:46vh;padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
  .bar{width:60px}
  .legend{display:none}
  header{padding-block:8px}
  .tools .btn{padding:6px 9px;font-size:12px}
  .lbl-long{display:none}
  header .brand span{display:none}
}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>

<div class="app">
  <header>
    <div class="brand"><b>ARC Group HK office</b><span>Site measurement plan. Type lengths any way you measured them. Shown in metres.</span></div>
    <div class="prog" title="Measured items"><div class="bar"><i id="barFill"></i></div><span id="progTxt">0 / 0</span></div>
    <div class="tools">
      <button class="btn primary" id="nextBtn">Next<span class="lbl-long"> to measure</span></button>
      <button class="btn" id="undoBtn" disabled>Undo</button>
      <select class="btn" id="labelsSel" aria-label="Which lengths to show"><option value="0">Lengths: hide</option><option value="1">Lengths: measured only</option><option value="2">Lengths: calculated only</option><option value="3">Lengths: all</option></select>
      <button class="btn" id="exportBtn">Export<span class="lbl-long"> for CAD</span></button>
    </div>
  </header>
  <main>
    <div class="canvas">
      <svg id="plan" role="img" aria-label="Office floor plan. Tap a wall, door, room or piece of furniture to enter its measurement.">
        <g id="world" transform="rotate(180)"><g id="gRooms"></g><g id="gObjs"></g><g id="gDoors"></g><g id="gWalls"></g><g id="gLabels"></g><g id="gSel"></g></g>
      </svg>
      <div class="legend">
        <span><i class="sw" style="border-color:var(--wall)"></i>Solid wall</span>
        <span><i class="sw" style="border-color:var(--glass)"></i>Glass</span>
        <span><i class="sw" style="border-color:var(--ok)"></i>Measured</span>
        <span><i class="sw" style="border-color:var(--bad)"></i>Numbers disagree</span>
      </div>
      <div class="zoom">
        <button class="btn" id="zin" aria-label="Zoom in">+</button>
        <button class="btn" id="zout" aria-label="Zoom out">&minus;</button>
        <button class="btn" id="zfit" aria-label="Fit plan" style="font-size:12px">Fit</button>
      </div>
    </div>
    <aside id="panel"></aside>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
/* ---------- Geometry from HK_Office_layout.pptx (points) ---------- */
const PT = 20; // starting guess: 1 pt on the slide = 20 mm. Replaced by measurements.
const OX = 82.5, OY = 247.5; // origin: left end of the office front wall
const GX_PT = {X0:82.5,XDH:154.5,XBG:226.5,XBB:233.7,XE0:253.5,XEN:316.5,XP1:436.2,XP2:559.5,XSM:739.5,X9:897,P1L:90.6,P1R:133.8,P2L:512.7,P2R:555.9,P3L:845.7,P3R:888.9};
const GY_PT = {YF:247.5,YD1:424.8,YSB:472.5,YSB2:477.5,YD4:505.8,YBB:522,YPT:540,Y9:630};
const r10 = v => Math.round(v/10)*10;
const EST = {x:{},y:{}};
for (const k in GX_PT) EST.x[k] = r10((GX_PT[k]-OX)*PT);
for (const k in GY_PT) EST.y[k] = r10((GY_PT[k]-OY)*PT);
const axisOf = id => (id in GX_PT) ? 'x' : 'y';

const ROOMS = [
  {id:'bigBoard',name:'Big boardroom (8 to 10)',k:'room',l:'X0',t:'YF',r:'XBB',b:'YBB',grp:'Rooms'},
  {id:'eating',name:'Eating area',k:'zone',l:'X0',t:'YBB',r:'XBB',b:'Y9',grp:'Rooms'},
  {id:'openPlan',name:'Open-plan workspace',k:'open',l:'XBB',t:'YF',r:'XSM',b:'Y9',grp:'Rooms'},
  {id:'printIT',name:'Print / IT',k:'core',l:'XP1',t:'YPT',r:'XP2',b:'Y9',grp:'Rooms',extra:[['XBB','XP1','Gap from boardroom glass to Print / IT'],['XP2','XSM','Gap from Print / IT to glass on left']]},
  {id:'smallBoard',name:'Small boardroom (6)',k:'room',l:'XSM',t:'YF',r:'X9',b:'YSB',grp:'Rooms'},
  {id:'securities',name:'Top left room',k:'room',l:'XSM',t:'YSB2',r:'X9',b:'Y9',grp:'Rooms'}
];
const WALLS = [
  ['w6','wall','YF','X0','XDH','Front wall, big boardroom'],
  ['g2','glass','YF','XBB','XSM','Front glass, big boardroom glass to small boardroom glass (main door included)'],
  ['w7','wall','YF','XSM','X9','Front wall, small boardroom'],
  ['n1','window','Y9','X0','X9','External windows, top'],
  ['n2','window','X0','YF','Y9','External windows, right'],
  ['n3','window','X9','YF','Y9','External windows, left'],
  ['g3','glass','XBB','YF','YBB','Big boardroom glass, left side'],
  ['g4','glass','YBB','X0','XBB','Big boardroom glass, top'],
  ['g5','glass','XSM','YF','YD1','Small boardroom glass, right side (door not included)'],
  ['g7','glass','XSM','YSB2','Y9','Top left room glass (door included, divider not included)'],
  ['w9','wall','YSB','XSM','X9','Divider between small boardroom and top left room']
].map(a=>({id:a[0],type:a[1],at:a[2],a:a[3],b:a[4],name:a[5]}));
const WALL_EXTRA={n2:[['YF','YBB','Big boardroom part (front wall to boardroom glass)'],['YBB','Y9','Eating area part (boardroom glass to top windows)']],n1:[['P1R','P2L','Gap between middle pillar and eating area pillar (pillars not included)']],g7:[['P2R','XSM','Gap from this glass to the middle pillar (pillar not included)']]};
const DIVIDER={w9:['YSB','YSB2']}; // divider drawn with real thickness between two lines
const DOORS = [
  {id:'d1',name:'Big boardroom door',at:'YF',a:'XDH',b:'XBG',hinge:'a',swing:1},
  {id:'d2',name:'Main entrance (card lock)',at:'YF',a:'XE0',b:'XEN',hinge:'a',swing:1}, // opens towards the big boardroom
  {id:'d3',name:'Small boardroom door',at:'XSM',a:'YD1',b:'YSB',hinge:'b',swing:1},
  {id:'d4',name:'Top left room door (locked)',at:'XSM',a:'YSB2',b:'YD4',hinge:'a',swing:1}
];
// furniture: [id, name, room, kind, x, y, w, h (pt), copy group]
const OBJ_RAW = [
  ['p1','Eating area pillar','eating','pillar',90.6,583.2,43.2,43.2],
  ['st','Cabinets along front glass','openPlan','rect',317.3,247.5,171.7,12.6],
  ['p2','Middle pillar (Print / IT)','printIT','pillar',512.7,583.2,43.2,43.2],
  ['p3','Top left room pillar','securities','pillar',845.7,583.2,43.2,43.2]
];
const CHAIRS_RAW = [
  ['bigBoard',10.8,[]],
  ['eating',9,[]],
  ['openPlan',10.8,[]],
  ['smallBoard',10.8,[]],
  ['securities',10.8,[]]
];
const ROOM = Object.fromEntries(ROOMS.map(r=>[r.id,r]));
const ptBox = r => ({l:GX_PT[r.l],t:GY_PT[r.t],r:GX_PT[r.r],b:GY_PT[r.b]});
const OBJS = OBJ_RAW.map(a=>{
  const [id,name,room,kind,x,y,w,h,grp] = a; const B = ptBox(ROOM[room]);
  const cx = x + w/2, cy = y + h/2;
  return {id,name,room,kind,grp:grp||null,
    fcx:(cx-B.l)/(B.r-B.l), fcy:(cy-B.t)/(B.b-B.t),
    ew:kind==='tvv'?100:r10(w*PT), eh:kind==='tvh'?100:r10(h*PT),
    sx:(cx-B.l) <= (B.r-cx) ? 'l':'r', sy:(cy-B.t) <= (B.b-cy) ? 't':'b'};
});
const OBJ = Object.fromEntries(OBJS.map(o=>[o.id,o]));
const CHAIRS = []; CHAIRS_RAW.forEach(([room,d,list])=>{const B=ptBox(ROOM[room]); list.forEach(([x,y])=>CHAIRS.push({room,fcx:(x+d/2-B.l)/(B.r-B.l),fcy:(y+d/2-B.t)/(B.b-B.t),d:r10(d*PT)}));});

/* ---------- span keys and relations ---------- */
function spanKey(a,b){ const ax=axisOf(a); const [p,q] = EST[ax][a] <= EST[ax][b] ? [a,b] : [b,a]; return ax+':'+p+':'+q; }
const SPAN_LABEL = {};
const REL = {x:new Map(), y:new Map()};
function addRel(a,b,label,weak){
  const key = spanKey(a,b); const [ax,p,q] = key.split(':');
  if (!REL[ax].has(key)) REL[ax].set(key,{key,a:p,b:q,est:EST[ax][q]-EST[ax][p],weak:!!weak});
  else if (!weak) REL[ax].get(key).weak = false;
  if (label && !SPAN_LABEL[key]) SPAN_LABEL[key] = label;
  return key;
}
ROOMS.forEach(r=>{ addRel(r.l,r.r,r.name+' width'); addRel(r.t,r.b,r.name+' depth'); (r.extra||[]).forEach(e=>addRel(e[0],e[1],e[2])); });
WALLS.forEach(w=>{ addRel(w.a,w.b,w.name); if (DIVIDER[w.id]) addRel(...DIVIDER[w.id],'Divider thickness'); (WALL_EXTRA[w.id]||[]).forEach(e=>addRel(e[0],e[1],e[2])); });
DOORS.forEach(d=>addRel(d.a,d.b,d.name+' opening'));
const SQ=new Set(['p1','p2','p3']); // square pillars (the user confirmed these are square)
// pillars sit on their own gridlines so gaps between them can be measured
const PIL = {p1:{L:'P1L',R:'P1R',extra:[['X0','P1L','Gap from window wall to pillar']]},
  p2:{L:'P2L',R:'P2R',extra:[['P2R','XSM','Gap from middle pillar to top left room glass (pillar not included)'],['P1R','P2L','Gap from middle pillar to eating area pillar (pillars not included)']]},
  p3:{L:'P3L',R:'P3R',extra:[['XSM','P3L','Gap from top left room glass to pillar'],['P3R','X9','Gap from pillar to window wall']]}};
for (const id in PIL){ const P=PIL[id]; addRel(P.L,P.R,SQ.has(id)?'Pillar width':'Pillar diameter'); P.extra.forEach(e=>addRel(e[0],e[1],e[2])); }
